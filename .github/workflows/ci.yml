name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Backend tests
        run: PYTHONPATH=./backend python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install frontend deps
        run: pnpm --prefix frontend install --frozen-lockfile
      - name: Lint
        run: pnpm --prefix frontend exec eslint src/lib/
      - name: Typecheck
        run: pnpm --prefix frontend exec tsc --noEmit
      - name: Unit tests (cross-engine conformance)
        run: pnpm --prefix frontend exec vitest run
      - name: Build
        run: pnpm --prefix frontend build
        env:
          GITHUB_PAGES: "true"
